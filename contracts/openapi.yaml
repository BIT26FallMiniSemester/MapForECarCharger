components:
  schemas:
    AdminLogin:
      properties:
        username:
          type: string
          maxLength: 32
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: AdminLogin
    ApiEnvelope:
      properties:
        code:
          type: integer
          title: Code
          default: 0
        message:
          type: string
          title: Message
          default: success
        data:
          title: Data
        request_id:
          type: string
          title: Request Id
      additionalProperties: true
      type: object
      required:
      - request_id
      title: ApiEnvelope
    Body_upload_avatar_api_v1_user_avatar_post:
      properties:
        avatar:
          type: string
          contentMediaType: application/octet-stream
          title: Avatar
          description: JPEG, PNG or WebP; maximum 2 MiB
      type: object
      required:
      - avatar
      title: Body_upload_avatar_api_v1_user_avatar_post
    CancelOrder:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Reason
      type: object
      title: CancelOrder
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HeartbeatCreate:
      properties:
        reported_at:
          type: string
          format: date-time
          title: Reported At
        device_status:
          type: string
          pattern: ^(ONLINE|OFFLINE)$
          title: Device Status
      type: object
      required:
      - reported_at
      - device_status
      title: HeartbeatCreate
    OrderCreate:
      properties:
        pile_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Pile Id
      type: object
      required:
      - pile_id
      title: OrderCreate
    OrderStatus:
      type: string
      enum:
      - PENDING
      - RESERVED
      - CHARGING
      - UNPAID
      - COMPLETED
      - CANCELLED
      title: OrderStatus
    PileStatus:
      type: string
      enum:
      - IDLE
      - RESERVED
      - CHARGING
      - FAULT
      - OFFLINE
      title: PileStatus
    PileStatusUpdate:
      properties:
        status:
          $ref: '#/components/schemas/PileStatus'
        reason:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Reason
      type: object
      required:
      - status
      title: PileStatusUpdate
    PileType:
      type: string
      enum:
      - FAST
      - SLOW
      title: PileType
    PredictionPointCreate:
      properties:
        prediction_type:
          $ref: '#/components/schemas/PredictionType'
        predicted_for:
          type: string
          format: date-time
          title: Predicted For
        predicted_value:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Predicted Value
      type: object
      required:
      - prediction_type
      - predicted_for
      - predicted_value
      title: PredictionPointCreate
    PredictionType:
      type: string
      enum:
      - LOAD_W
      - AVAILABLE_PILES
      - CONGESTION_SCORE
      title: PredictionType
    PredictionsCreate:
      properties:
        station_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Station Id
        horizon_hours:
          type: integer
          title: Horizon Hours
        model_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Model Version
        generated_at:
          type: string
          format: date-time
          title: Generated At
        points:
          items:
            $ref: '#/components/schemas/PredictionPointCreate'
          type: array
          maxItems: 500
          minItems: 1
          title: Points
      type: object
      required:
      - horizon_hours
      - model_version
      - generated_at
      - points
      title: PredictionsCreate
    ProfileUpdate:
      properties:
        nickname:
          type: string
          maxLength: 32
          minLength: 1
          title: Nickname
      type: object
      required:
      - nickname
      title: ProfileUpdate
    RechargeCreate:
      properties:
        amount_cents:
          type: integer
          maximum: 1000000.0
          minimum: 1.0
          title: Amount Cents
        client_request_id:
          type: string
          maxLength: 64
          minLength: 8
          title: Client Request Id
      type: object
      required:
      - amount_cents
      - client_request_id
      title: RechargeCreate
    StationCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
        address:
          type: string
          maxLength: 255
          minLength: 1
          title: Address
        latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Latitude
        longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Longitude
        price_cents_per_kwh:
          type: integer
          exclusiveMinimum: 0.0
          title: Price Cents Per Kwh
        operator_name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Operator Name
        service_type:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: Service Type
        district:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: District
        region_scope:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: Region Scope
        location_type:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Location Type
        fast_connector_count:
          type: integer
          minimum: 0.0
          title: Fast Connector Count
          default: 0
        slow_connector_count:
          type: integer
          minimum: 0.0
          title: Slow Connector Count
          default: 0
        piles:
          items:
            $ref: '#/components/schemas/StationPileCreate'
          type: array
          maxItems: 100
          title: Piles
      type: object
      required:
      - name
      - address
      - latitude
      - longitude
      - price_cents_per_kwh
      title: StationCreate
    StationPileCreate:
      properties:
        pile_no:
          type: string
          maxLength: 32
          minLength: 1
          title: Pile No
        pile_type:
          $ref: '#/components/schemas/PileType'
        rated_power_w:
          type: integer
          exclusiveMinimum: 0.0
          title: Rated Power W
      type: object
      required:
      - pile_no
      - pile_type
      - rated_power_w
      title: StationPileCreate
    StationStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      title: StationStatus
    StationUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Name
        address:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Address
        latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Longitude
        price_cents_per_kwh:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Price Cents Per Kwh
        operator_name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Operator Name
        service_type:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: Service Type
        district:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: District
        region_scope:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
          - type: 'null'
          title: Region Scope
        location_type:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Location Type
        fast_connector_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Fast Connector Count
        slow_connector_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Slow Connector Count
        status:
          anyOf:
          - $ref: '#/components/schemas/StationStatus'
          - type: 'null'
      type: object
      title: StationUpdate
    TelemetryCreate:
      properties:
        reported_at:
          type: string
          format: date-time
          title: Reported At
        energy_wh:
          type: integer
          minimum: 0.0
          title: Energy Wh
      type: object
      required:
